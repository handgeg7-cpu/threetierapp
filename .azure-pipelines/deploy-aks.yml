trigger: 
  branches:
    include:
      - main

  paths:
    include:
      - .azure-pipelines/deploy-aks.yml

pool:
  vmImage: 'ubuntu-latest'

steps:

- task: KubernetesManifest@1
  displayName: 'Deploy Backend'
  inputs:
    action: deploy
    kubernetesServiceConnection: 'aks-connection'
    namespace: default
    manifests: |
      kubernetes/Deployment.yaml
    
    #containers: |
      #threetierapp.azurecr.io/backend:$(Build.BuildId)