trigger: 
  branches:
    include:
      - main
      
  paths:
    include:
      - .azure-pipelines/deploy-aks.yml
      - .azure-pipelines/deploy-aks.yml
      -  Deployment.yaml
      
pool:
  vmImage: 'ubuntu-latest'

steps:

- task: KubernetesManifest@1
  displayName: 'Deploy Backend'
  inputs:
    action: deploy
    kubernetesServiceConnection: 'aks-connection'
    namespace: default
    manifests: |
      kubernetes/postgres-deployment.yml
      kubernetes/postgres-service.yml
      kubernetes/Deployment.yaml
      ingress/ingress.yaml
      kubernetes/backend-service.yml
      kubernetes/frontend-deployment.yaml
      kubernetes/frontend-service.yaml
    
    #containers: |
      #threetierapp.azurecr.io/backend:$(Build.BuildId)