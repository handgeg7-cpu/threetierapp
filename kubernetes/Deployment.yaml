apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend  

  template:
    metadata: 

      labels:
        app: backend    

    spec: 
      containers:
        - name: backend
          image: threeierapp.azurecr.io:$(Build.BuildId)
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@db:5432/appdb"